[project]
name = "jarvis"
version = "0.1.0"
description = "A local voice assistant that performs everyday PC tasks, built to learn LangChain and LangGraph."
readme = "README.md"
authors = [
    { name = "Malhar1404", email = "malhar@hexacoder.com" }
]
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.17",
    "faster-whisper>=1.2.1",
    "google-auth>=2.62.1",
    "gspread>=6.2.1",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.18",
    "numpy>=2.5.4",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pynput>=1.8.2",
    "pyside6-essentials>=6.12.0",
    "pywin32>=312",
    "screen-brightness-control>=0.27.2",
    "setuptools<81",
    "sounddevice>=0.5.6",
    "webrtcvad>=2.0.10",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
