<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Loop Flow</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1f2328; --muted: #6b7280; --border: #dfe3e8;
    --you: #2563eb; --code: #0d9488; --model: #9333ea; --tool: #ea580c;
    --db: #b45309; --live: #db2777; --edge: #cfd5dc; --soft: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --panel: #1d2026; --text: #e7e9ec; --muted: #9aa1aa; --border: #2f343c;
      --you: #60a5fa; --code: #2dd4bf; --model: #c084fc; --tool: #fb923c;
      --db: #fbbf24; --live: #f472b6; --edge: #3a4049; --soft: #252a31;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --panel: #1d2026; --text: #e7e9ec; --muted: #9aa1aa; --border: #2f343c;
    --you: #60a5fa; --code: #2dd4bf; --model: #c084fc; --tool: #fb923c;
    --db: #fbbf24; --live: #f472b6; --edge: #3a4049; --soft: #252a31;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  code, pre { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  .layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

  .stage { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
  svg { width: 100%; height: auto; display: block; }

  .node rect { fill: var(--panel); stroke-width: 2.5; transition: filter .3s, opacity .3s; }
  .node.dashed rect { stroke-dasharray: 7 6; }
  .node .title { font-weight: 700; font-size: 15.5px; fill: var(--text); }
  .node .small { font-size: 11px; fill: var(--muted); }
  .node.pulse rect { animation: pulse .7s ease-out; }
  @keyframes pulse { 0% { stroke-width: 2.5; } 40% { stroke-width: 7; } 100% { stroke-width: 2.5; } }
  .edge { fill: none; stroke: var(--edge); stroke-width: 2; stroke-dasharray: 5 6; }
  .edge.active { stroke-width: 3.5; stroke-dasharray: none; }

  .packet rect { stroke-width: 2; }
  .packet text { font: 600 12.5px ui-monospace, Consolas, monospace; fill: #fff; }

  .side { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .crumbs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .crumb { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .crumb.on { background: var(--code); color: #fff; font-weight: 700; }
  .stepnum { font-size: 13px; color: var(--muted); }
  .side h2 { font-size: 18px; margin: 2px 0 8px; }
  .side p { margin: 0 0 14px; }
  .label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 5px; }
  .box {
    background: var(--soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px;
    font: 13px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
  }
  .chips { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--border); border-left: 4px solid var(--muted); border-radius: 7px;
    padding: 4px 9px; font-size: 13.5px; transition: background .3s;
  }
  .chip.new { background: var(--soft); font-weight: 600; }
  .chip.new::after { content: "  ← new"; color: var(--muted); font-weight: 400; }

  .codebox { max-height: 230px; overflow-y: auto; }
  .line { display: block; white-space: pre; padding: 1px 6px; border-radius: 4px; color: var(--muted); font-size: 12.5px; }
  .line.active { background: var(--hl, var(--soft)); color: var(--text); font-weight: 600; }
  .line .ln { display: inline-block; width: 2.4em; opacity: .55; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  button {
    font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--code); border-color: var(--code); color: #fff; font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--edge); cursor: pointer; border: 0; padding: 0; }
  .dot.on { background: var(--code); }
  .dot.gap { margin-right: 6px; }
</style>
</head>
<body>
<main>
  <h1>The agent loop, end to end</h1>
  <p class="sub">Based on <code>src/jarvis/agent/graph.py</code>. Press <b>Next</b> (or →) and watch the packet move.</p>

  <div class="layout">
    <div>
      <div class="stage">
        <svg id="svg" viewBox="0 0 800 540" role="img" aria-label="Animated agent loop flow chart">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"></path>
            </marker>
          </defs>
          <g id="edges"></g>
          <g id="nodes"></g>
          <g id="packet" class="packet" opacity="0">
            <rect id="packet-bg" rx="7" height="26"></rect>
            <text id="packet-text" y="5" text-anchor="middle"></text>
          </g>
        </svg>
      </div>
      <div class="controls">
        <button id="prev">← Back</button>
        <button id="next" class="primary">Next →</button>
        <button id="replay">↻ Replay this step</button>
        <button id="auto">▶ Auto play</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>

    <aside class="side">
      <div class="crumbs" id="crumbs"></div>
      <div class="stepnum" id="stepnum"></div>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="label">The packet carries</div>
      <div class="box" id="carry"></div>
      <div class="label">The messages list</div>
      <div class="chips" id="msgs"></div>
      <div class="label">Code</div>
      <div class="box codebox" id="code"></div>
    </aside>
  </div>
</main>

<script>
const NS = 'http://www.w3.org/2000/svg';
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const NODES = {
  start:   { x: 110, y: 90,  w: 120, h: 56, title: 'START',     small: 'the beginning',            color: '--you' },
  live:    { x: 120, y: 260, w: 180, h: 66, title: 'Live output (UI)', small: 'what you watch update', color: '--live', dashed: true },
  chatbot: { x: 410, y: 260, w: 190, h: 74, title: 'chatbot',   small: 'calls the model',           color: '--model' },
  end:     { x: 690, y: 150, w: 120, h: 56, title: 'END',       small: 'stop',                       color: '--you' },
  tools:   { x: 410, y: 450, w: 190, h: 74, title: 'tools',     small: 'runs the tool(s)',           color: '--tool' },
  db:      { x: 680, y: 450, w: 190, h: 66, title: 'save_to_db', small: 'audit log · Phase 4',       color: '--db', dashed: true },
};
const REVERSE_PAIRS = new Set(['chatbot>tools', 'tools>chatbot']);

const PART_LABELS = ['', '1 · The loop', '2 · Any node can join', '3 · Streaming'];

// One combined listing: the real graph.py (numbered) + hypothetical snippets ('·' = illustrative).
const CODE = [
  [22, 'reply = llm.invoke(state["messages"])'],
  [23, 'return {"messages": [reply]}'],
  [25, 'def run_tools(state):'],
  [27, '    results = [run_tool(c, tools_by_name) for c in last.tool_calls]'],
  [30, 'def has_tool_calls(state) -> str:'],
  [32, '    last = state["messages"][-1]'],
  [33, '    return "tools" if last.tool_calls else "end"'],
  [39, 'builder.add_edge(START, "chatbot")'],
  [40, 'builder.add_conditional_edges("chatbot", has_tool_calls, {...})'],
  [41, 'builder.add_edge("tools", "chatbot")  # always loop back'],
  ['·', '--- hypothetical: Phase 4 audit log, not in our code yet ---'],
  ['·', 'def save_to_db(state): audit_log.write(state["messages"][-1])'],
  ['·', 'builder.add_edge("tools", "save_to_db")'],
  ['·', 'builder.add_edge("save_to_db", "chatbot")'],
  ['·', '--- streaming: same graph, a different way to read it ---'],
  ['·', 'for update in graph.stream(q, stream_mode="updates"): ...'],
  ['·', 'for chunk, meta in graph.stream(q, stream_mode="messages"): ...'],
];

const STEPS = [
  { part: 1, from: 'start', to: 'chatbot', packet: 'question', color: '--you', active: [7],
    title: 'You ask a question with a hidden dependency',
    text: 'You need 2×3 BEFORE the model can multiply that by 10 — it cannot answer both parts in one shot. This is exactly why a loop matters.',
    carry: '"What is 2 x 3, and then multiply that answer by 10?"',
    msgs: [{ text: 'Human: "What is 2×3, then that ×10?"', color: '--you' }] },

  { part: 1, from: 'chatbot', to: 'tools', packet: 'multiply(2,3)', color: '--model', active: [0, 1, 4, 5, 6, 8],
    title: 'Round 1: the model can only do the first part',
    text: 'chatbot calls the model. It cannot know the final answer yet, so it asks for multiply(2,3) only. The conditional edge reads the last message, sees tool_calls, and routes to "tools".',
    carry: 'tool_call → multiply(a=2, b=3)\n(router returns "tools")',
    msgs: [
      { text: 'Human: "What is 2×3, then that ×10?"', color: '--you' },
      { text: 'AI: tool_call → multiply(2, 3)', color: '--model' },
    ] },

  { part: 1, from: 'tools', to: 'chatbot', packet: 'result: 6', color: '--tool', active: [2, 3, 9],
    title: 'tools runs it for real',
    text: 'run_tools finds the call and runs real Python: 2 * 3. It wraps 6 as a ToolMessage. An UNCONDITIONAL edge sends it straight back to chatbot — no decision needed here.',
    carry: 'ToolMessage: 6',
    msgs: [
      { text: 'Human: "What is 2×3, then that ×10?"', color: '--you' },
      { text: 'AI: tool_call → multiply(2, 3)', color: '--model' },
      { text: 'Tool: 6', color: '--tool' },
    ] },

  { part: 1, from: 'chatbot', to: 'tools', packet: 'multiply(6,10)', color: '--model', active: [0, 1, 8],
    title: 'Round 2: NOW it has enough to finish',
    text: 'chatbot runs again, this time seeing the 6. It asks for a SECOND tool call: multiply(6,10). Same has_tool_calls function, same 3 lines — different state, routes to "tools" again.',
    carry: 'tool_call → multiply(a=6, b=10)\n(router returns "tools") — 2nd time through the loop',
    msgs: [
      { text: 'Human: "What is 2×3, then that ×10?"', color: '--you' },
      { text: 'AI: tool_call → multiply(2, 3)', color: '--model' },
      { text: 'Tool: 6', color: '--tool' },
      { text: 'AI: tool_call → multiply(6, 10)', color: '--model' },
    ] },

  { part: 1, from: 'tools', to: 'chatbot', packet: 'result: 60', color: '--tool', active: [2, 3, 9],
    title: 'tools runs the second call',
    text: 'Same node, same code, just called again. This is the loop actually earning its keep — two full round trips, which Phase 1\'s one-shot script physically could not do.',
    carry: 'ToolMessage: 60',
    msgs: [
      { text: 'Human: "What is 2×3, then that ×10?"', color: '--you' },
      { text: 'AI: tool_call → multiply(2, 3)', color: '--model' },
      { text: 'Tool: 6', color: '--tool' },
      { text: 'AI: tool_call → multiply(6, 10)', color: '--model' },
      { text: 'Tool: 60', color: '--tool' },
    ] },

  { part: 1, from: 'chatbot', to: 'end', packet: '"60"', color: '--model', active: [0, 1, 6, 8],
    title: 'No more tool_calls → the router says "end"',
    text: 'chatbot writes the final answer with no tool_calls this time. has_tool_calls checks messages[-1] again, finds it empty, and returns "end" instead of "tools" — the mapping sends that straight to END.',
    carry: '"2 x 3 x 10 is 60."',
    msgs: [
      { text: 'Human: "What is 2×3, then that ×10?"', color: '--you' },
      { text: 'AI: tool_call → multiply(2, 3)', color: '--model' },
      { text: 'Tool: 6', color: '--tool' },
      { text: 'AI: tool_call → multiply(6, 10)', color: '--model' },
      { text: 'Tool: 60', color: '--tool' },
      { text: 'AI: "2 x 3 x 10 is 60."', color: '--model' },
    ] },

  { part: 2, from: 'tools', to: 'db', packet: 'log entry', color: '--tool', active: [11],
    title: 'A node can be ANYTHING — here, a database',
    text: 'Imagine logging every tool result for Phase 4\'s audit trail. We\'d add one new node, wired exactly the way "tools" was: add_node, then an edge. This node does not exist in our real code yet — it\'s what Phase 4 will add.',
    carry: 'audit_log.write(ToolMessage: "Tuesday, 03 Nov 2026, 14:10")',
    msgs: [
      { text: 'Human: "What time is it?"', color: '--you' },
      { text: 'AI: tool_call → get_time()', color: '--model' },
      { text: 'Tool: "Tuesday, 03 Nov 2026, 14:10"', color: '--tool' },
    ] },

  { part: 2, from: 'db', to: 'chatbot', packet: 'continue', color: '--db', active: [12, 13],
    title: 'It always runs — no decision needed',
    text: 'Logging should happen every single time, not sometimes — so it\'s wired with a plain add_edge, the same unconditional kind as tools → chatbot. Only chatbot needed a conditional edge, because only there did we need a real decision.',
    carry: '(continues back to chatbot, as if nothing happened)',
    msgs: [
      { text: 'Human: "What time is it?"', color: '--you' },
      { text: 'AI: tool_call → get_time()', color: '--model' },
      { text: 'Tool: "Tuesday, 03 Nov 2026, 14:10"', color: '--tool' },
    ] },

  { part: 3, from: 'chatbot', to: 'live', packet: 'AIMessage (whole)', color: '--model', active: [15],
    title: 'stream_mode="updates": one packet per finished node',
    text: 'The UI is told "chatbot just finished" ONE time, carrying the WHOLE reply. Good for an activity log — "thinking… done." Not useful for making text appear live, word by word.',
    carry: 'update: {chatbot: {messages: [AIMessage]}}',
    msgs: [
      { text: 'Human: "Say hi in a few words."', color: '--you' },
      { text: 'AI: "Hi there! Quick reply coming up."', color: '--model' },
    ] },

  { part: 3, from: 'chatbot', to: 'live', packet: '', color: '--live', active: [16],
    title: 'stream_mode="messages": many tiny packets, as they\'re written',
    text: 'Same chatbot call, same final text — but now the UI gets each small piece the instant the model writes it. This is what lets Jarvis show (and later speak) text as it is generated, not after a pause.',
    carry: 'token by token, as they are generated',
    msgs: [
      { text: 'Human: "Say hi in a few words."', color: '--you' },
      { text: 'AI: "Hi there! Quick reply coming up."', color: '--model' },
    ],
    burst: ['Hi', ' there!', ' Quick', ' reply', ' coming', ' up.'] },
];

const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};

function border(n, tx, ty) {
  const dx = tx - n.x, dy = ty - n.y;
  const t = Math.min((n.w / 2) / Math.abs(dx || 1e-6), (n.h / 2) / Math.abs(dy || 1e-6));
  return [n.x + dx * t, n.y + dy * t];
}

function edgePath(a, b) {
  const A = NODES[a], B = NODES[b];
  const key = a + '>' + b;
  const off = REVERSE_PAIRS.has(key) ? 12 : 0;
  const len = Math.hypot(B.x - A.x, B.y - A.y);
  const px = -(B.y - A.y) / len, py = (B.x - A.x) / len;
  const [sx, sy] = border(A, B.x, B.y);
  const [ex, ey] = border(B, A.x, A.y);
  const bend = 40;
  const cx = (sx + ex) / 2 + px * bend, cy = (sy + ey) / 2 + py * bend;
  return `M${sx + px * off},${sy + py * off} Q${cx},${cy} ${ex + px * off},${ey + py * off}`;
}

const edges = {};
const edgeLayer = document.getElementById('edges');
STEPS.forEach(({ from, to }) => {
  const key = from + '>' + to;
  if (edges[key]) return;
  const p = svgEl('path', { d: edgePath(from, to), class: 'edge' });
  edgeLayer.appendChild(p);
  edges[key] = p;
});

const nodeEls = {};
const nodeLayer = document.getElementById('nodes');
for (const [id, n] of Object.entries(NODES)) {
  const g = svgEl('g', { class: 'node' + (n.dashed ? ' dashed' : '') });
  const r = svgEl('rect', { x: n.x - n.w / 2, y: n.y - n.h / 2, width: n.w, height: n.h, rx: 14 });
  r.style.stroke = `var(${n.color})`;
  const t = svgEl('text', { x: n.x, y: n.y - 5, 'text-anchor': 'middle', class: 'title' });
  t.textContent = n.title;
  const s = svgEl('text', { x: n.x, y: n.y + 15, 'text-anchor': 'middle', class: 'small' });
  s.textContent = n.small;
  g.append(r, t, s);
  nodeLayer.appendChild(g);
  nodeEls[id] = { g, small: s, base: n.small };
}

const packet = document.getElementById('packet');
const packetBg = document.getElementById('packet-bg');
const packetText = document.getElementById('packet-text');

let i = 0, anim = null, autoTimer = null, autoOn = false;
const $ = (id) => document.getElementById(id);

function onArrive(step) {
  const g = nodeEls[step.to].g;
  g.classList.remove('pulse'); void g.getBBox(); g.classList.add('pulse');
  if (autoOn) autoTimer = setTimeout(() => go(i + 1), step.burst ? 1500 : 2200);
}

function sizePacket(label, color) {
  packetText.textContent = label;
  const w = Math.max(50, packetText.getComputedTextLength() + 20);
  packetBg.setAttribute('width', w);
  packetBg.setAttribute('x', -w / 2);
  packetBg.setAttribute('y', -13);
  packetBg.style.fill = color;
  packetBg.style.stroke = color;
}

function animateSingle(step) {
  const path = edges[step.from + '>' + step.to];
  const total = path.getTotalLength();
  const color = css(step.color);
  sizePacket(step.packet, color);
  packet.setAttribute('opacity', 1);

  const start = performance.now(), dur = 1500;
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const frame = (now) => {
    const t = Math.min(1, (now - start) / dur);
    const pt = path.getPointAtLength(ease(t) * total);
    packet.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    if (t < 1) { anim = requestAnimationFrame(frame); return; }
    onArrive(step);
  };
  anim = requestAnimationFrame(frame);
}

function animateBurst(step) {
  const path = edges[step.from + '>' + step.to];
  const total = path.getTotalLength();
  const color = css(step.color);
  let idx = 0;

  function playNext() {
    if (idx >= step.burst.length) { onArrive(step); return; }
    const token = step.burst[idx++];
    sizePacket(token.trim() === '' ? '·' : token, color);
    packet.setAttribute('opacity', 1);
    const start = performance.now(), dur = 380;
    const frame = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const pt = path.getPointAtLength(t * total);
      packet.setAttribute('transform', `translate(${pt.x},${pt.y})`);
      if (t < 1) { anim = requestAnimationFrame(frame); return; }
      setTimeout(playNext, 90);
    };
    anim = requestAnimationFrame(frame);
  }
  playNext();
}

function animate(step) {
  cancelAnimationFrame(anim);
  const active = edges[step.from + '>' + step.to];
  active.classList.add('active');
  active.style.stroke = css(step.color);
  active.setAttribute('marker-end', 'url(#arrow)');
  if (step.burst) animateBurst(step); else animateSingle(step);
}

function render() {
  const s = STEPS[i];
  clearTimeout(autoTimer);

  Object.values(edges).forEach((p) => {
    p.classList.remove('active'); p.style.stroke = ''; p.removeAttribute('marker-end');
  });

  for (const [id, el] of Object.entries(nodeEls)) {
    const on = id === s.from || id === s.to;
    el.g.style.opacity = on ? 1 : 0.45;
  }

  const crumbs = $('crumbs');
  crumbs.replaceChildren();
  [1, 2, 3].forEach((p) => {
    const c = document.createElement('span');
    c.className = 'crumb' + (s.part === p ? ' on' : '');
    c.textContent = PART_LABELS[p];
    crumbs.appendChild(c);
  });

  $('stepnum').textContent = `Step ${i + 1} of ${STEPS.length}`;
  $('title').textContent = s.title;
  $('text').textContent = s.text;
  $('carry').textContent = s.carry;

  const msgsBox = $('msgs');
  msgsBox.replaceChildren();
  const prevLen = i > 0 ? STEPS[i - 1].msgs.length : 0;
  s.msgs.forEach((m, idx) => {
    const c = document.createElement('div');
    c.className = 'chip' + (idx >= prevLen ? ' new' : '');
    c.style.borderLeftColor = css(m.color);
    c.textContent = `${idx + 1}. ${m.text}`;
    msgsBox.appendChild(c);
  });

  const codeBox = $('code');
  codeBox.replaceChildren();
  CODE.forEach(([ln, txt], idx) => {
    const line = document.createElement('span');
    line.className = 'line' + (s.active.includes(idx) ? ' active' : '');
    const gutter = document.createElement('span');
    gutter.className = 'ln';
    gutter.textContent = String(ln);
    line.appendChild(gutter);
    line.appendChild(document.createTextNode(txt));
    codeBox.appendChild(line);
  });
  const activeLine = codeBox.querySelector('.active');
  if (activeLine) activeLine.scrollIntoView({ block: 'center' });

  $('prev').disabled = i === 0;
  $('next').disabled = i === STEPS.length - 1;
  [...$('dots').children].forEach((d, idx) => d.classList.toggle('on', idx === i));

  animate(s);
}

function go(n) {
  if (n < 0 || n >= STEPS.length) { setAuto(false); return; }
  i = n; render();
}
function setAuto(on) {
  autoOn = on;
  $('auto').textContent = on ? '⏸ Pause' : '▶ Auto play';
  if (!on) clearTimeout(autoTimer);
}

let lastPart = 0;
STEPS.forEach((s, idx) => {
  const d = document.createElement('button');
  d.className = 'dot' + (s.part !== lastPart && lastPart !== 0 ? ' gap' : '');
  lastPart = s.part;
  d.title = `Step ${idx + 1}`; d.setAttribute('aria-label', `Step ${idx + 1}`);
  d.onclick = () => go(idx);
  $('dots').appendChild(d);
});
$('prev').onclick = () => go(i - 1);
$('next').onclick = () => go(i + 1);
$('replay').onclick = () => render();
$('auto').onclick = () => {
  if (autoOn) { setAuto(false); return; }
  setAuto(true);
  go(i === STEPS.length - 1 ? 0 : i + 1);
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(i + 1);
  if (e.key === 'ArrowLeft') go(i - 1);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

render();
</script>
</body>
</html>
